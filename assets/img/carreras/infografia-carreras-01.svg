"Apasionados-por-gene" font-family="FiraSans-Regular, Fira Sans" font-size="16" font-weight="normal" fill="#FFFFFF"><tspan x="294.884" y="186">Apasionados por generar un impacto </tspan><tspan x="279.22" y="211">positivo a nuestro alrededor, a través del </tspan><tspan x="293.46" y="236">trabajo diario y el espíritu innovador.</tspan></text><text id="Somos-personas-que-d" font-family="FiraSans-Regular, Fira Sans" font-size="16" font-weight="normal" fill="#FFFFFF"><tspan x="601" y="418">Somos personas que dentro </tspan><tspan x="601" y="443">y fuera de #FreshKampo nos </tspan><tspan x="601" y="468">conducimos con rectitud y </tspan><tspan x="601" y="493">respeto.</tspan></text><text id="Pasión" font-family="Pacifico-Regular, Pacifico" font-size="32" font-weight="normal" fill="#FFFFFF"><tspan x="383.372" y="147">Pasión</tspan></text><text id="Entregamos-resultado" font-family="FiraSans-Regular, Fira Sans" font-size="16" font-weight="normal" fill="#FFFFFF"><tspan x="314.564" y="653">Entregamos resultados con una </tspan><tspan x="317.06" y="678">ejecución impecable buscando </tspan><tspan x="333.092" y="703">el beneficio del productor, </tspan><tspan x="328.044" y="728">colaboradores y accionistas </tspan><tspan x="335.34" y="753">dentro de un marco ético.</tspan></text><text id="Compartimos-nuestra-Copy" font-family="FiraSans-Regular, Fira Sans" font-size="16" font-weight="normal" fill="#FFFFFF"><tspan x="100.008" y="418">Compartimos nuestra </tspan><tspan x="93.832" y="443">experiencia en pro del </tspan><tspan x="82.024" y="468">#EquipoFreshKampo sin </tspan><tspan x="86.488" y="493">esperar nada a cambio.</tspan></text><text id="Alto-Desempeño" font-family="Pacifico-Regular, Pacifico" font-size="32" font-weight="normal" fill="#FFFFFF"><tspan x="320.076" y="623">Alto Desempeño</tspan></text><text id="Generosidad-Copy" font-family="Pacifico-Regular, Pacifico" font-size="32" font-weight="normal" fill="#FFFFFF"><tspan x="92.136" y="383">Generosidad</tspan></text><text